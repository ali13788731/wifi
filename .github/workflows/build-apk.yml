name: Build APK

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Unit tests (HTTP 200/206/401/416, redirects, headers, segments, limiter)
        run: gradle testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Decode keystore (only if the KEYSTORE_BASE64 secret exists)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release keystore."
          else
            echo "No KEYSTORE_BASE64 secret: the release APK will be unsigned."
          fi

      - name: Build release APK (signed when the keystore secrets are set)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BAZAAR_RSA_KEY: ${{ secrets.BAZAAR_RSA_KEY }}
        run: gradle assembleRelease --no-daemon

      - name: Show the APK signature (SHA-256)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in app/build/outputs/apk/release/*.apk; do
            echo "== $f"; "$APKSIGNER" verify --print-certs "$f" || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: DualNet-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: DualNet-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/**

      - name: Publish debug APK as a pre-release (easy phone download)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DualNet-debug.apk
          gh release create "dualnet-build-${{ github.run_number }}" DualNet-debug.apk \
            --prerelease --target "${{ github.sha }}" \
            --title "DualNet debug build #${{ github.run_number }}" \
            --notes "Debug APK built from ${{ github.sha }}. Not yet tested on a real device."
